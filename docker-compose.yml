services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_BASE=${AI_API_BASE:-https://api.openai.com/v1}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - DATABASE_PATH=/app/data/fraud_sentinel.db
      - STREAM_TPS=${STREAM_TPS:-15}
      - DETECTION_EVERY_N_EDGES=${DETECTION_EVERY_N_EDGES:-30}
      - FRONTEND_ORIGIN=http://localhost:3000
    volumes:
      - sentinel-data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/stream
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  sentinel-data:
